
name: Update Files

on:
  push:
    branches: [ main ]
    paths:
      - 'fonts/**'
      - 'LittlePaimon/**'

  workflow_dispatch:

# 允许 GitHub Actions 创建 Release 并上传附件
permissions:
  contents: write

jobs:
  update:
    name: Update Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Update files
        run: |
          python generate_res_list.py

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resources-${{ github.run_number }}
          name: LittlePaimonRes 资源更新 #${{ github.run_number }}
          body: |
            自动生成并发布的小派蒙资源文件。

            - resources_list.json：资源列表
            - resources.zip：资源压缩包
          files: |
            resources_list.json
            resources.zip
          fail_on_unmatched_files: true
          make_latest: true
